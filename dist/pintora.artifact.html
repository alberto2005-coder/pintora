<title>Pintora</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: menu bar / options bar / [toolbox | stage | docks] / status bar.
   Phones: toolbox becomes a bottom strip, docks become a sheet. */
:root {
  --bg: #dfe2e7; --panel: #f3f4f6; --panel-hi: #e6e8ec; --line: #c9ced7;
  --text: #1d2129; --muted: #5a6372; --accent: #9a5f00; --accent-ink: #ffffff; --accent-soft: #f3e3c4;
  --stage: #c5c9d1; --check-a: #ffffff; --check-b: #dfe2e8; --danger: #b42b1f; --shadow: rgba(20, 24, 33, .22);
  --font-ui: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-brand: "Fraunces", Georgia, "Times New Roman", serif;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161a; --panel: #1c1f25; --panel-hi: #272b33; --line: #323844;
    --text: #e9ebf0; --muted: #9aa1af; --accent: #e2a73a; --accent-ink: #1a1406; --accent-soft: #3a2e14;
    --stage: #0f1114; --check-a: #2c3037; --check-b: #23262c; --danger: #ee7468; --shadow: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14161a; --panel: #1c1f25; --panel-hi: #272b33; --line: #323844;
  --text: #e9ebf0; --muted: #9aa1af; --accent: #e2a73a; --accent-ink: #1a1406; --accent-soft: #3a2e14;
  --stage: #0f1114; --check-a: #2c3037; --check-b: #23262c; --danger: #ee7468; --shadow: rgba(0, 0, 0, .55);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.35 var(--font-ui); overflow: hidden; -webkit-user-select: none; user-select: none; }
* { box-sizing: border-box; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); gap: 0; min-width: 0; }
html.native .app { padding-inline: 0; }

/* menu bar */
.menubar { display: flex; align-items: center; gap: 4px; height: 40px; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: var(--r) var(--r) 0 0; padding: 0 8px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; padding-right: 10px; margin-right: 4px; border-right: 1px solid var(--line); height: 24px; flex: none; }
.brand svg { width: 22px; height: 22px; }
.brand span { font: 600 17px/1 var(--font-brand); letter-spacing: .01em; }
#menus { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
#menus::-webkit-scrollbar { display: none; }
.menubtn { background: none; border: 0; padding: 5px 9px; border-radius: 5px; white-space: nowrap; }
.menubtn:hover, .menubtn.open { background: var(--panel-hi); }
.grow { flex: 1; }
.iconbtn { display: inline-grid; place-items: center; width: 30px; height: 30px; background: none; border: 1px solid transparent; border-radius: 5px; color: var(--text); }
.iconbtn:hover:not(:disabled) { background: var(--panel-hi); }
.iconbtn:disabled { opacity: .35; cursor: default; }
.iconbtn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
#btnDocks { display: none; }

/* options bar */
.optionsbar { display: flex; align-items: center; gap: 14px; min-height: 42px; background: var(--panel-hi); border: 1px solid var(--line); border-bottom: 0; padding: 4px 10px; overflow-x: auto; scrollbar-width: thin; }
.optionsbar .tname { font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.optionsbar .hint { color: var(--muted); white-space: nowrap; }
.opt { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.opt label { color: var(--muted); }
.opt input[type=range] { width: 96px; accent-color: var(--accent); }
.opt .val { min-width: 34px; font-variant-numeric: tabular-nums; }
.opt select, .field select, .field input[type=text], .field input[type=number], .field textarea, .dock select { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; min-height: 26px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.seg button { background: var(--panel); border: 0; padding: 4px 9px; border-right: 1px solid var(--line); min-height: 26px; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.btn { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 4px 12px; min-height: 28px; }
.btn:hover { background: var(--panel-hi); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }

/* main */
.main { display: grid; grid-template-columns: auto minmax(0, 1fr) 286px; min-height: 0; border: 1px solid var(--line); background: var(--line); gap: 1px; }
.toolbox { background: var(--panel); padding: 6px; display: grid; grid-template-columns: repeat(2, 36px); grid-auto-rows: 36px; gap: 4px; align-content: start; overflow-y: auto; scrollbar-width: none; }
.tool { display: grid; place-items: center; background: none; border: 1px solid transparent; border-radius: 6px; color: var(--text); }
.tool:hover { background: var(--panel-hi); }
.tool.on { background: var(--accent); color: var(--accent-ink); }
.stage { position: relative; background: var(--stage); min-width: 0; min-height: 0; overflow: hidden; touch-action: none; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.docks { background: var(--panel); display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
.dock-tabs { display: none; }
.dock { border-bottom: 1px solid var(--line); padding: 8px 10px 10px; min-width: 0; }
.dock h3 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.dock.layers { flex: 1; display: flex; flex-direction: column; min-height: 240px; }
.dock.history { max-height: 200px; display: flex; flex-direction: column; border-bottom: 0; }

/* colour */
.colorpick { display: grid; grid-template-columns: 1fr 18px; gap: 8px; height: 132px; }
.colorpick canvas { width: 100%; height: 100%; border-radius: 4px; border: 1px solid var(--line); cursor: crosshair; touch-action: none; display: block; }
.swatchrow { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.fgbg { position: relative; width: 44px; height: 40px; flex: none; }
.fgbg button { position: absolute; width: 28px; height: 28px; border: 2px solid var(--panel); outline: 1px solid var(--line); border-radius: 4px; padding: 0; }
.fgbg #swFg { left: 0; top: 0; z-index: 2; }
.fgbg #swBg { right: 0; bottom: 0; }
.fgbg button.sel { outline: 2px solid var(--accent); }
.hexrow { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
.hexrow input { width: 78px; font-variant-numeric: tabular-nums; text-transform: uppercase; }
.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(18px, 1fr)); gap: 4px; margin-top: 8px; }
.palette button { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 3px; padding: 0; }

/* layers */
.layerctl { display: grid; grid-template-columns: 1fr; gap: 6px; margin-bottom: 8px; }
.layerctl .row { display: flex; align-items: center; gap: 8px; }
.layerctl select { flex: 1; min-width: 0; }
.layerctl input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
.layerctl .val { min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
.layerlist { flex: 1; overflow-y: auto; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); min-height: 120px; }
.lrow { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-bottom: 1px solid var(--line); background: var(--panel); }
.lrow.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.lrow .eye { width: 24px; height: 24px; flex: none; }
.lrow canvas { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 3px; background: repeating-conic-gradient(var(--check-a) 0% 25%, var(--check-b) 0% 50%) 0 0 / 10px 10px; flex: none; image-rendering: auto; }
.lrow canvas.mask { background: #000; }
.lrow canvas.mask.edit { outline: 2px solid var(--accent); }
.lrow .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .name input { width: 100%; }
.lrow .meta { color: var(--muted); font-size: 11px; }
.layerbtns { display: flex; gap: 2px; margin-top: 6px; flex-wrap: wrap; }
.histlist { overflow-y: auto; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); flex: 1; min-height: 60px; }
.hrow { display: flex; width: 100%; text-align: left; background: var(--panel); border: 0; border-bottom: 1px solid var(--line); padding: 4px 8px; gap: 6px; }
.hrow.cur { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); font-weight: 600; }
.hrow.future { color: var(--muted); }

/* status */
.status { display: flex; align-items: center; gap: 16px; min-height: 30px; background: var(--panel); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 var(--r) var(--r); padding: 0 10px; overflow-x: auto; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); scrollbar-width: none; }
.status select { padding: 1px 4px; min-height: 22px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
.status .sp { flex: 1; }

/* menus + dialogs */
#menuHost .menu { position: fixed; z-index: 50; min-width: 230px; max-height: calc(100% - 60px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 30px var(--shadow); padding: 5px; }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; text-align: left; padding: 6px 10px; border-radius: 5px; }
.menu button:hover:not(:disabled), .menu button:focus-visible { background: var(--accent); color: var(--accent-ink); }
.menu button:disabled { opacity: .4; cursor: default; }
.menu .lbl { flex: 1; }
.menu .key { color: var(--muted); font-size: 11.5px; }
.menu button:hover:not(:disabled) .key { color: inherit; opacity: .85; }
.menu .chk { width: 14px; text-align: center; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.menu .grp { padding: 6px 10px 2px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.scrim { position: fixed; inset: 0; background: rgba(8, 10, 14, .5); display: grid; place-items: center; z-index: 60; padding: 16px; }
.dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 20px 60px var(--shadow); width: min(440px, 100%); max-height: 100%; display: flex; flex-direction: column; }
.dialog.wide { width: min(640px, 100%); }
.dialog header { padding: 14px 18px 4px; font: 600 18px/1.2 var(--font-brand); }
.dialog .body { padding: 10px 18px; overflow-y: auto; display: grid; gap: 10px; }
.dialog footer { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 18px 16px; }
.field { display: grid; grid-template-columns: 140px 1fr; align-items: center; gap: 10px; }
.field > label { color: var(--muted); }
.field .ctl { display: flex; align-items: center; gap: 8px; min-width: 0; }
.field input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
.field input[type=number] { width: 78px; }
.field input[type=text], .field textarea, .field select { width: 100%; min-width: 0; }
.field textarea { min-height: 84px; resize: vertical; }
.field input[type=color] { width: 44px; height: 28px; padding: 0; border: 1px solid var(--line); background: none; }
.field .note { color: var(--muted); font-size: 12px; }
.dialog .info { color: var(--muted); }
.dialog kbd, .kbdtable td:first-child { font: 12px var(--font-ui); background: var(--panel-hi); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.kbdtable { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.kbdtable td { padding: 3px 6px 3px 0; vertical-align: top; }
.kbdtable td:first-child { display: table-cell; width: 1%; }
#toast { position: fixed; left: 50%; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; z-index: 80; box-shadow: 0 6px 20px var(--shadow); max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .18s; }
#toast.show { opacity: 1; }
.dropveil { position: absolute; inset: 8px; border: 2px dashed var(--accent); border-radius: 10px; display: none; place-items: center; background: color-mix(in srgb, var(--stage) 80%, transparent); font-weight: 600; color: var(--accent); z-index: 5; pointer-events: none; }
.dropveil.on { display: grid; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }

/* phones and narrow windows */
@media (max-width: 820px) {
  #btnDocks { display: inline-grid; }
  .brand span { display: none; }
  .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .stage { order: 1; }
  .toolbox { order: 2; display: flex; overflow-x: auto; overflow-y: hidden; padding: 6px; gap: 4px; }
  .toolbox .tool { flex: none; width: 40px; height: 40px; }
  .docks { display: none; position: fixed; left: 0; right: 0; bottom: 0; top: 38%; z-index: 40; border-top: 1px solid var(--line); box-shadow: 0 -12px 30px var(--shadow); padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .docks.open { display: flex; }
  .dock-tabs { display: flex; gap: 4px; padding: 8px 0 4px; position: sticky; top: 0; background: var(--panel); z-index: 2; }
  .dock-tabs button { flex: 1; background: var(--panel-hi); border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
  .dock-tabs button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .dock { display: none; padding-inline: 0; }
  .dock.show { display: flex; flex-direction: column; }
  .dock.history { max-height: none; }
  .field { grid-template-columns: 1fr; gap: 4px; }
  .optionsbar { gap: 10px; }
}

</style>
<div class="app" id="app">
  <header class="menubar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="var(--accent)"/><path d="M11 25V8h6.2a5.2 5.2 0 0 1 0 10.4H11" fill="none" stroke="var(--accent-ink)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23.5" cy="23.5" r="2.2" fill="var(--accent-ink)"/></svg>
      <span>Pintora</span>
    </div>
    <nav id="menus" aria-label="Menús"></nav>
    <div class="grow"></div>
    <button class="iconbtn" id="btnUndo" title="Deshacer (Ctrl+Z)" aria-label="Deshacer"></button>
    <button class="iconbtn" id="btnRedo" title="Rehacer (Ctrl+Y)" aria-label="Rehacer"></button>
    <button class="iconbtn" id="btnTheme" title="Cambiar tema" aria-label="Cambiar tema"></button>
    <button class="iconbtn" id="btnDocks" title="Paneles: color, capas, historial" aria-label="Paneles"></button>
  </header>
  <div class="optionsbar" id="options"></div>
  <div class="main">
    <aside class="toolbox" id="toolbox" aria-label="Herramientas"></aside>
    <section class="stage" id="stage">
      <canvas id="view" tabindex="0" aria-label="Lienzo"></canvas>
      <div class="dropveil" id="dropveil">Suelta una imagen para abrirla</div>
    </section>
    <aside class="docks" id="docks">
      <div class="dock-tabs" id="dockTabs">
        <button data-dock="color">Color</button><button data-dock="layers" class="on">Capas</button><button data-dock="history">Historial</button>
      </div>
      <section class="dock color" data-dock="color">
        <h3>Color</h3>
        <div class="colorpick"><canvas id="svBox" width="220" height="132" aria-label="Saturación y brillo"></canvas><canvas id="hueBar" width="18" height="132" aria-label="Tono"></canvas></div>
        <div class="swatchrow">
          <div class="fgbg"><button id="swBg" title="Color de fondo (clic para editar)" aria-label="Color de fondo"></button><button id="swFg" class="sel" title="Color de frente (clic para editar)" aria-label="Color de frente"></button></div>
          <div class="hexrow"><input type="text" id="hexIn" maxlength="7" aria-label="Color hexadecimal" spellcheck="false"><button class="iconbtn" id="btnSwap" title="Intercambiar (X)" aria-label="Intercambiar colores"></button><button class="iconbtn" id="btnDefColors" title="Negro y blanco (D)" aria-label="Colores por defecto"></button></div>
        </div>
        <div class="palette" id="palette"></div>
      </section>
      <section class="dock layers show" data-dock="layers">
        <h3>Capas</h3>
        <div class="layerctl">
          <div class="row"><select id="modeSel" aria-label="Modo de mezcla"></select></div>
          <div class="row"><input type="range" id="opacSel" min="0" max="100" step="1" value="100" aria-label="Opacidad de capa"><span class="val" id="opacVal">100%</span></div>
          <div class="row"><label><input type="checkbox" id="lockAlpha"> Bloquear transparencia</label></div>
        </div>
        <div class="layerlist" id="layerList"></div>
        <div class="layerbtns" id="layerBtns"></div>
      </section>
      <section class="dock history" data-dock="history">
        <h3>Historial</h3>
        <div class="histlist" id="histList"></div>
      </section>
    </aside>
  </div>
  <footer class="status" id="status">
    <span id="stCoords">—</span><span id="stSel"></span><span class="sp"></span><span id="stInfo"></span>
    <label>Zoom <select id="zoomSel" aria-label="Zoom"></select></label>
  </footer>
</div>
<div id="menuHost"></div>
<div id="dialogHost"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileInput" accept="image/*,.json,application/json" hidden multiple>

async function decodeImage(file) {
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch (e) {
    bmp = await new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => { res(im); }; im.onerror = () => rej(new Error('No se pudo leer la imagen')); im.src = u; });
  }
  const w = bmp.width || bmp.naturalWidth, hh = bmp.height || bmp.naturalHeight;
  if (w > MAX_DIM || hh > MAX_DIM) throw new Error('La imagen mide ' + w + '×' + hh + ' px. El máximo es ' + MAX_DIM + '×' + MAX_DIM + '.');
  const c = document.createElement('canvas'); c.width = w; c.height = hh;
  const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(bmp, 0, 0);
  if (bmp.close) bmp.close();
  return { w, h: hh, data: g.getImageData(0, 0, w, hh).data };
}

}

async function saveBlob(name, blob) {
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename: name, data: blob }); toast('Guardado: ' + name); return; }
    catch (e) { if (e && e.code === 'declined') return; if (e && e.code === 'too_large') { toast('El archivo es demasiado grande para guardarlo aquí.'); return; } }
  }
  const u = URL.createObjectURL(blob), a = h('a', { href: u, download: name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000);
  toast('Guardado: ' + name);
}
function baseName() { return (S.name || 'imagen').replace(/\.(pintora\.json|json|png|jpe?g|webp)$/i, ''); }

async function exportImage(fmt, quality, bg) {
  const d = S.doc; flushDirty();
  const data = fmt === 'jpeg' ? E.flattenOn(d.layers, d.w, d.h, bg) : S.flat;
  const c = dataToCanvas(data, d.w, d.h);
  const mime = fmt === 'jpeg' ? 'image/jpeg' : fmt === 'webp' ? 'image/webp' : 'image/png';
  const blob = await canvasBlob(c, mime, quality);
  if (!blob) { toast('Este navegador no puede exportar ' + fmt.toUpperCase() + '.'); return; }
  await saveBlob(baseName() + '.' + (fmt === 'jpeg' ? 'jpg' : fmt), blob);
}

/* project file: JSON with PNG layers */
async function saveProject() {
  const d = S.doc, layers = [];
  for (const l of d.layers) {
    const o = { name: l.name, visible: l.visible, opacity: l.opacity, mode: l.mode, lockAlpha: l.lockAlpha, maskOn: l.maskOn, text: l.text };
    o.png = dataToCanvas(l.data, d.w, d.h).toDataURL('image/png');
    if (l.mask) { const m = new Uint8ClampedArray(d.w * d.h * 4); for (let i = 0; i < l.mask.length; i++) { m[i * 4] = m[i * 4 + 1] = m[i * 4 + 2] = l.mask[i]; m[i * 4 + 3] = 255; } o.mask = dataToCanvas(m, d.w, d.h).toDataURL('image/png'); }
    layers.push(o);
  }
  const act = d.indexOf(d.activeId);
  const json = JSON.stringify({ format: 'pintora', version: 1, w: d.w, h: d.h, active: act, layers });
  await saveBlob(baseName() + '.pintora.json', new Blob([json], { type: 'application/json' }));
  S.modified = false;
}
async function imageFromURL(url) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('Proyecto dañado')); im.src = url; });
}
async function loadProject(text, name) {
  const p = JSON.parse(text);
  if (p.format !== 'pintora' || !Array.isArray(p.layers) || !p.w || !p.h) throw new Error('No es un proyecto de Pintora');
  if (p.w > MAX_DIM || p.h > MAX_DIM) throw new Error('El proyecto supera el tamaño máximo.');
  const doc = new E.Doc(p.w, p.h);
  for (const o of p.layers) {
    const l = E.makeLayer(p.w, p.h, o.name);
    const im = await imageFromURL(o.png), c = document.createElement('canvas'); c.width = p.w; c.height = p.h;
    const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(im, 0, 0); l.data = g.getImageData(0, 0, p.w, p.h).data;
    Object.assign(l, { visible: o.visible !== false, opacity: o.opacity === undefined ? 1 : o.opacity, mode: E.MODES[o.mode] ? o.mode : 'normal', lockAlpha: !!o.lockAlpha, maskOn: o.maskOn !== false, text: o.text || null });
    if (o.mask) { const mi = await imageFromURL(o.mask); g.clearRect(0, 0, p.w, p.h); g.drawImage(mi, 0, 0); const md = g.getImageData(0, 0, p.w, p.h).data; l.mask = new Uint8Array(p.w * p.h); for (let i = 0; i < l.mask.length; i++) l.mask[i] = md[i * 4]; }
    doc.layers.push(l);

  doc.activeId = doc.layers[clamp(p.active | 0, 0, doc.layers.length - 1)].id;
  setDoc(doc, (name || 'Proyecto').replace(/\.pintora\.json$|\.json$/i, '')); S.modified = false;
}

async function openFiles(files, asLayers) {
  files = Array.from(files); if (!files.length) return;
  for (const f of files) {
    try {
      if (/\.json$/i.test(f.name) || f.type === 'application/json') {
        if (!(await confirmDiscard())) return;
        await loadProject(await f.text(), f.name); toast('Proyecto abierto: ' + f.name); continue;
      }
      const im = await decodeImage(f);
      if (asLayers && S.doc) addImageAsLayer(im, f.name);
      else { if (!(await confirmDiscard())) return; openAsDocument(im, f.name); }
    } catch (e) { toast(e.message || 'No se pudo abrir ' + f.name); }
  }
}
function openAsDocument(im, name) {
  const doc = new E.Doc(im.w, im.h), l = E.makeLayer(im.w, im.h, 'Fondo'); l.data = new Uint8ClampedArray(im.data);
  doc.layers.push(l); doc.activeId = l.id; setDoc(doc, name.replace(/\.[a-z0-9]+$/i, '')); S.modified = false;
  toast(name + ' · ' + im.w + '×' + im.h + ' px');
}
function addImageAsLayer(im, name) {
  const d = S.doc, data = new Uint8ClampedArray(d.w * d.h * 4), ox = Math.round((d.w - im.w) / 2), oy = Math.round((d.h - im.h) / 2);
  for (let y = 0; y < im.h; y++) {
    const ty = y + oy; if (ty < 0 || ty >= d.h) continue;
    for (let x = 0; x < im.w; x++) { const tx = x + ox; if (tx < 0 || tx >= d.w) continue; const si = (y * im.w + x) * 4, di = (ty * d.w + tx) * 4; data[di] = im.data[si]; data[di + 1] = im.data[si + 1]; data[di + 2] = im.data[si + 2]; data[di + 3] = im.data[si + 3]; }
  }
  d.addLayerFromData((name || 'Capa').replace(/\.[a-z0-9]+$/i, ''), data, 'Abrir como capa'); docChanged();
}

  return new Promise((res) => {

    dialog({ title: 'Descartar cambios', fields: [{ type: 'info', text: 'La imagen actual tiene cambios sin guardar. Si continúas se perderán.' }], ok: 'Descartar', onOk: () => res(true), onCancel: () => res(false) });
  });
}

/* ---------------- clipboard ---------------- */
function copySelection(cut) {
  const d = S.doc, L = d.active; if (!L) return false;
  const sel = d.selection, b = sel ? E.maskBounds(sel, d.w, d.h) : { x0: 0, y0: 0, x1: d.w, y1: d.h };
  if (!b) return false;
  const w = b.x1 - b.x0, hh = b.y1 - b.y0, out = new Uint8ClampedArray(w * hh * 4);
  for (let y = 0; y < hh; y++) for (let x = 0; x < w; x++) {
    const p = (y + b.y0) * d.w + x + b.x0, si = p * 4, di = (y * w + x) * 4, m = sel ? sel[p] / 255 : 1;
    out[di] = L.data[si]; out[di + 1] = L.data[si + 1]; out[di + 2] = L.data[si + 2]; out[di + 3] = L.data[si + 3] * m;
  }
  S.clip = { w, h: hh, x: b.x0, y: b.y0, data: out };
  if (cut) clearSelection(true);
  toast(cut ? 'Cortado' : 'Copiado'); return true;
}
function clearSelection(isCut) {

  if (L.lockAlpha && !isCut) { toast('La transparencia de esta capa está bloqueada.'); return; }
  d.beginOp(isCut ? 'Cortar' : 'Borrar', L, 'data'); const sel = d.selection;
  for (let p = 0; p < d.w * d.h; p++) { const m = sel ? sel[p] : 255; if (m) L.data[p * 4 + 3] = L.data[p * 4 + 3] * (255 - m) / 255; }
  docChanged();
}
function pasteClip(clip, asNew) {
  const d = S.doc; clip = clip || S.clip; if (!clip) { toast('El portapapeles está vacío.'); return; }
  const data = new Uint8ClampedArray(d.w * d.h * 4);
  const ox = clip.x, oy = clip.y;
  for (let y = 0; y < clip.h; y++) { const ty = y + oy; if (ty < 0 || ty >= d.h) continue; for (let x = 0; x < clip.w; x++) { const tx = x + ox; if (tx < 0 || tx >= d.w) continue; const si = (y * clip.w + x) * 4, di = (ty * d.w + tx) * 4; data[di] = clip.data[si]; data[di + 1] = clip.data[si + 1]; data[di + 2] = clip.data[si + 2]; data[di + 3] = clip.data[si + 3]; } }

}
document.addEventListener('paste', async (e) => {
  if (e.target && /input|textarea/i.test(e.target.tagName)) return;
  const items = e.clipboardData ? Array.from(e.clipboardData.items) : [];
  const img = items.find((i) => i.type.startsWith('image/'));
  if (img && S.doc) { e.preventDefault(); try { const im = await decodeImage(img.getAsFile()); addImageAsLayer(im, 'Pegado'); } catch (err) { toast(err.message); } }
  else if (S.clip && S.doc) { e.preventDefault(); pasteClip(); }
});

/* ---------------- text rasteriser ---------------- */
function measureText(t) {
  const c = document.createElement('canvas').getContext('2d'); c.font = fontString(t);
  const lines = String(t.text).split('\n'); let mw = 0; const widths = lines.map((l) => { const w = c.measureText(l).width; if (w > mw) mw = w; return w; });
  return { lines, widths, w: mw, h: lines.length * t.size * t.lh };
}
function fontString(t) { return (t.italic ? 'italic ' : '') + (t.bold ? '700 ' : '400 ') + t.size + 'px ' + t.font; }
function renderText(t, w, hh) {
  const c = document.createElement('canvas'); c.width = w; c.height = hh;
  const g = c.getContext('2d', { willReadFrequently: true }); g.font = fontString(t); g.fillStyle = t.color; g.textBaseline = 'top';
  const m = measureText(t);
  m.lines.forEach((line, i) => {
    const x = t.x + (t.align === 'center' ? (m.w - m.widths[i]) / 2 : t.align === 'right' ? m.w - m.widths[i] : 0);
    g.fillText(line, x, t.y + i * t.size * t.lh);
  });
  return g.getImageData(0, 0, w, hh).data;
}

/* ---------------- sample document ---------------- */
function buildSample() {
  const W = 960, H = 600, doc = new E.Doc(W, H);
  const sky = doc.addLayer('Cielo', { r: 0, g: 0, b: 0 });
  E.fillGradient(sky.data, W, H, null, 0, 0, 0, H * 0.85, 'linear', { r: 28, g: 43, b: 82, a: 1 }, { r: 240, g: 178, b: 122, a: 1 }, 1);
  const sun = doc.addLayer('Sol', null); sun.mode = 'screen';
  E.fillGradient(sun.data, W, H, null, 640, 372, 640, 120, 'radial', { r: 255, g: 238, b: 190, a: 1 }, { r: 255, g: 150, b: 60, a: 0 }, 1);
  const ridge = (base, amp, f1, f2, ph) => { const pts = [[0, H], [0, base]]; for (let x = 0; x <= W; x += 6) pts.push([x, base + Math.sin(x * f1 + ph) * amp + Math.sin(x * f2 + ph * 2) * amp * 0.45]); pts.push([W, H]); return pts; };
  const far = doc.addLayer('Colinas lejanas', null);
  E.fillMask(far.data, W, H, E.polygonMask(W, H, ridge(400, 34, 0.008, 0.021, 1.2)), null, { r: 78, g: 74, b: 108 }, 1, false);
  const near = doc.addLayer('Colinas cercanas', null);
  E.fillMask(near.data, W, H, E.polygonMask(W, H, ridge(470, 42, 0.006, 0.017, 3.4)), null, { r: 22, g: 30, b: 34 }, 1, false);
  const grain = doc.addLayer('Grano', { r: 128, g: 128, b: 128 }); grain.mode = 'overlay'; grain.opacity = 0.35;
  grain.data = E.applyFilter('noise', grain.data, W, H, { amount: 55, mono: true, seed: 7 });
  doc.activeId = near.id; doc.undoStack.length = 0; doc.redoStack.length = 0;
  return doc;
}

/* ---------- rectangle / ellipse select ---------- */
function makeBoxSelect(kind) {
  let st = null;
  const rectFor = (s, ev) => {
    let x0 = s.x0, y0 = s.y0, x1 = ev.x, y1 = ev.y;
    if (ev.shift && !s.pressShift) { const m = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)); x1 = x0 + (x1 < x0 ? -m : m); y1 = y0 + (y1 < y0 ? -m : m); }
    if (ev.alt) { x0 = s.x0 - (x1 - s.x0); y0 = s.y0 - (y1 - s.y0); }
    return { x0: Math.round(Math.min(x0, x1)), y0: Math.round(Math.min(y0, y1)), x1: Math.round(Math.max(x0, x1)), y1: Math.round(Math.max(y0, y1)) };
  };

    cursor: 'crosshair',
    down(ev) { st = { x0: ev.x, y0: ev.y, mode: selModeFrom(ev), pressShift: ev.shift, sx: ev.cx, sy: ev.cy, moved: false, r: null }; },
    move(ev) { if (!st) return; if (!st.moved && Math.hypot(ev.cx - st.sx, ev.cy - st.sy) < 3) return; st.moved = true; st.r = rectFor(st, ev); schedule(); },
    up() {

      if (!s.moved || !s.r || s.r.x1 - s.r.x0 < 1 || s.r.y1 - s.r.y0 < 1) { if (d.selection) { d.setSelection(null, 'Quitar selección'); refreshAll(); } schedule(); return; }
      const r = s.r, mask = kind === 'rect' ? E.rectMask(d.w, d.h, r.x0, r.y0, r.x1, r.y1) : E.ellipseMask(d.w, d.h, r.x0, r.y0, r.x1, r.y1, S.opts.aa);
      commitSel(mask, kind === 'rect' ? 'Selección rectangular' : 'Selección elíptica', s.mode);
    },
    cancel() { st = null; schedule(); },
    key(e) { if (e.key === 'Escape' && st) { st = null; schedule(); return true; } return false; },
    overlay(ctx) {
      if (!st || !st.r) return; const [ax, ay] = toScreen(st.r.x0, st.r.y0), [bx, by] = toScreen(st.r.x1, st.r.y1);
